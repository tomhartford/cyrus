# Cyrus AI - Docker Compose Configuration
# This file provides easy orchestration for running Cyrus in Docker
#
# Usage:
#   1. Copy .env.example to .env and fill in your values
#   2. docker-compose up -d
#   3. docker-compose logs -f to view logs
#
# For detailed setup instructions, see docs/DOCKER_DEPLOYMENT.md

version: '3.8'

services:
  cyrus:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cyrus
    restart: unless-stopped

    # Environment variables loaded from .env file
    env_file:
      - .env

    # Port mapping - adjust if using different port
    ports:
      - "${CYRUS_SERVER_PORT:-3456}:${CYRUS_SERVER_PORT:-3456}"

    # Persistent volumes
    volumes:
      # Cyrus data directory (config, repos, worktrees)
      - cyrus-data:/data/cyrus

      # SSH keys for Git authentication (optional - see setup guide)
      # Uncomment and configure if using SSH for Git operations
      # - ~/.ssh:/home/cyrus/.ssh:ro

      # GitHub CLI config (optional - see setup guide)
      # Uncomment and configure if creating PRs via GitHub CLI
      # - ~/.config/gh:/home/cyrus/.config/gh:ro

    # Network configuration
    networks:
      - cyrus-network

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${CYRUS_SERVER_PORT:-3456}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  # Persistent storage for Cyrus data
  cyrus-data:
    driver: local

networks:
  cyrus-network:
    driver: bridge

# Alternative configuration for production deployment with external volumes:
#
# volumes:
#   cyrus-data:
#     driver: local
#     driver_opts:
#       type: none
#       device: /path/to/persistent/storage
#       o: bind
